# Linux SDK variants follow sdk_core/CMakeLists.txt.
default:
  - livox_sdk2_package
targets:
  livox_sdk2_package:
    kind: interface
    deps:
      - livox_lidar_sdk_shared
      - livox_lidar_sdk_static
    install: true
    install_files:
      cmake/Livox-SDK2ConfigVersion.cmake: share/Livox-SDK2/cmake/Livox-SDK2ConfigVersion.cmake
    cmake:
      directory: share/Livox-SDK2/cmake
      config: cmake/Livox-SDK2Config.cmake.in
      exports:
        Livox-SDK2Targets.cmake:
          livox_sdk2::shared:
            target: livox_lidar_sdk_shared
            include_dirs:
              - include
          livox_sdk2::static:
            target: livox_lidar_sdk_static
            include_dirs:
              - include
  livox_lidar_sdk_static:
    kind: static
    std: gnu++11
    deps:
      - livox_sdk_rapidjson
    sources:
      - 3rdparty/FastCRC/FastCRCsw.cpp
      - sdk_core/device_manager.cpp
      - sdk_core/livox_lidar_sdk.cpp
      - sdk_core/params_check.cpp
      - sdk_core/parse_cfg_file.cpp
      - sdk_core/base/io_loop.cpp
      - sdk_core/base/thread_base.cpp
      - sdk_core/base/io_thread.cpp
      - sdk_core/base/logging.cpp
      - sdk_core/base/network/unix/network_util.cpp
      - sdk_core/base/multiple_io/multiple_io_base.cpp
      - sdk_core/base/multiple_io/multiple_io_epoll.cpp
      - sdk_core/base/multiple_io/multiple_io_poll.cpp
      - sdk_core/base/multiple_io/multiple_io_select.cpp
      - sdk_core/base/multiple_io/multiple_io_kqueue.cpp
      - sdk_core/base/wake_up/unix/wake_up_pipe.cpp
      - sdk_core/comm/comm_port.cpp
      - sdk_core/comm/sdk_protocol.cpp
      - sdk_core/comm/generate_seq.cpp
      - sdk_core/upgrade_manager.cpp
      - sdk_core/upgrade/firmware.cpp
      - sdk_core/upgrade/livox_lidar_upgrader.cpp
      - sdk_core/logger_handler/logger_manager.cpp
      - sdk_core/logger_handler/logger_handler.cpp
      - sdk_core/logger_handler/file_manager.cpp
      - sdk_core/data_handler/data_handler.cpp
      - sdk_core/command_handler/command_impl.cpp
      - sdk_core/command_handler/general_command_handler.cpp
      - sdk_core/command_handler/hap_command_handler.cpp
      - sdk_core/command_handler/mid360_command_handler.cpp
      - sdk_core/command_handler/build_request.cpp
      - sdk_core/command_handler/parse_lidar_state_info.cpp
      - sdk_core/command_handler/mid360s_command_handler.cpp
      - sdk_core/command_handler/avia2_command_handler.cpp
      - sdk_core/debug_point_cloud_handler/debug_point_cloud_manager.cpp
      - sdk_core/debug_point_cloud_handler/debug_point_cloud_handler.cpp
    include_dirs:
      - 3rdparty
      - 3rdparty/spdlog
      - sdk_core
    public_include_dirs:
      - include
    header_exports:
      3rdparty/rapidjson: rapidjson
    compile_options:
      - -pthread
      - -Wall
    link_options:
      - -pthread
    install: true
    install_deps:
      - livox_sdk2_package
  livox_lidar_sdk_shared:
    kind: shared
    std: gnu++11
    deps:
      - livox_sdk_rapidjson
    sources:
      - 3rdparty/FastCRC/FastCRCsw.cpp
      - sdk_core/device_manager.cpp
      - sdk_core/livox_lidar_sdk.cpp
      - sdk_core/params_check.cpp
      - sdk_core/parse_cfg_file.cpp
      - sdk_core/base/io_loop.cpp
      - sdk_core/base/thread_base.cpp
      - sdk_core/base/io_thread.cpp
      - sdk_core/base/logging.cpp
      - sdk_core/base/network/unix/network_util.cpp
      - sdk_core/base/multiple_io/multiple_io_base.cpp
      - sdk_core/base/multiple_io/multiple_io_epoll.cpp
      - sdk_core/base/multiple_io/multiple_io_poll.cpp
      - sdk_core/base/multiple_io/multiple_io_select.cpp
      - sdk_core/base/multiple_io/multiple_io_kqueue.cpp
      - sdk_core/base/wake_up/unix/wake_up_pipe.cpp
      - sdk_core/comm/comm_port.cpp
      - sdk_core/comm/sdk_protocol.cpp
      - sdk_core/comm/generate_seq.cpp
      - sdk_core/upgrade_manager.cpp
      - sdk_core/upgrade/firmware.cpp
      - sdk_core/upgrade/livox_lidar_upgrader.cpp
      - sdk_core/logger_handler/logger_manager.cpp
      - sdk_core/logger_handler/logger_handler.cpp
      - sdk_core/logger_handler/file_manager.cpp
      - sdk_core/data_handler/data_handler.cpp
      - sdk_core/command_handler/command_impl.cpp
      - sdk_core/command_handler/general_command_handler.cpp
      - sdk_core/command_handler/hap_command_handler.cpp
      - sdk_core/command_handler/mid360_command_handler.cpp
      - sdk_core/command_handler/build_request.cpp
      - sdk_core/command_handler/parse_lidar_state_info.cpp
      - sdk_core/command_handler/mid360s_command_handler.cpp
      - sdk_core/command_handler/avia2_command_handler.cpp
      - sdk_core/debug_point_cloud_handler/debug_point_cloud_manager.cpp
      - sdk_core/debug_point_cloud_handler/debug_point_cloud_handler.cpp
    include_dirs:
      - 3rdparty
      - 3rdparty/spdlog
      - sdk_core
    public_include_dirs:
      - include
    header_exports:
      3rdparty/rapidjson: rapidjson
    compile_options:
      - -pthread
      - -Wall
    link_options:
      - -pthread
    install: true
    install_deps:
      - livox_sdk2_package
  livox_sdk_rapidjson:
    kind: interface
    public_include_dirs:
      - 3rdparty
